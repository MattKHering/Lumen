function recommend(){const list=all().filter(c=>!progress(c.id).done);return list.sort((a,b)=>Number(state.interests.includes(b.category))-Number(state.interests.includes(a.category))||Number(!!state.progress[b.id])-Number(!!state.progress[a.id]))}

ards(rec.filter(x=>x.id!==c.id).slice(0,6)),'<button class="link" data-go="Explore">View all →</button>')+section('A thought to keep','<div class="editorialnote"><div><div class="eyebrow">Learning science</div><h2>Knowing is different from recognizing.</h2><p class="muted">Try explaining one thing you learned today without looking at the lesson. That effort is part of learning.</p></div><button class="secondary" data-open="memory">Explore memory →</button></div>')}
function explore(){let q=search.toLowerCase().trim();let arr=all().filter(c=>(filter==='All'||c.category===filter)&&(format==='All'||c.format===format)&&(!q||(c.title+' '+c.desc+' '+c.category+' '+c.slides.map(s=>s.title+' '+s.text).join(' ')).toLowerCase().includes(q)));return '<div class="eyebrow">The collection</div><h1>Explore ideas.</h1><p class="muted" style="margin:8px 0 20px">Original illustrated lessons from across the world of knowledge.</p><div class="row" style="align-items:stretch"><input style="flex:2" id="search" type="search" placeholder="Search subjects and concepts…" value="'+E(search)+'" aria-label="Search lessons"><select id="format" style="flex:1;min-width:115px;max-width:180px" aria-label="Content format">'+['All','Course','Quick read'].map(f=>'<option '+(f===format?'selected':'')+'>'+f+'</option>').join('')+'</select></div><div class="filters">'+['All',...categories()].map(f=>'<button class="pill '+(f===filter?'active':'')+'" data-filter="'+E(f)+'">'+E(f)+'</button>').join('')+'</div><div class="sectionhead"><h2>'+E(filter==='All'?'All learning':filter)+'</h2><small>'+arr.length+' titles</small></div><div id="results">'+cards(arr)+'</div>'}
function library(){const saved=Object.entries(state.saved).map(([k,v])=>({k,v,c:get(k.split(':')[0])})).filter(x=>x.c);return '<div class="eyebrow">Your collection</div><h1>My library.</h1>'+section('Saved insights',saved.length?'<div class="list">'+saved.map(({k,v,c})=>'<div class="listitem"><div><div class="meta">'+E(c.title)+'</div><h3>'+E(v.title)+'</h3><p class="muted">'+E(state.notes[k]||v.text)+'</p></div><div class="row"><button class="secondary" data-note="'+E(k)+'">Note</button><button class="iconbtn" data-unsave="'+E(k)+'" aria-label="Remove bookmark">'+icon('close')+'</button></div></div>').join('')+'</div>':'<div class="empty">Bookmark a slide as you learn to build your personal knowledge library.</div>')+section('In progress',cards(all().filter(c=>state.progress[c.id]&&!progress(c.id).done)))+section('Completed',cards(completed()))}
function review(){const d=due();return '<div class="eyebrow">Make knowledge stick</div><h1>Remember more.</h1><p class="muted" style="margin:8px 0 20px">Retrieve ideas from memory, with reviews spaced over time.</p><div class="panel"><h2>'+d.length+' '+(d.length===1?'concept':'concepts')+' ready</h2><p class="muted">'+(d.length?'Your next review is drawn from lessons you have completed.':'Finish a lesson to unlock its review questions.')+'</p><button class="primary" data-action="review" '+(d.length?'':'disabled')+'>Start review →</button></div>'+section('Review schedule','<div class="list">'+(Object.keys(state.review).length?Object.entries(state.review).filter(([k])=>get(k.split(':')[0])).sort((a,b)=>a[1].next-b[1].next).map(([k,v])=>{let [id,i]=k.split(':');let c=get(id);return '<div class="listitem"><div><div class="meta">'+E(c.title)+'</div><h3>'+E(c.questions[Number(i)]?.q||'Concept')+'</h3><small>'+ (v.next<=Date.now()?'Due now':'Next: '+new Date(v.next).toLocaleDateString())+'</small></div><small>Level '+v.level+'</small></div>'}).join(''):'<div class="empty">Your review schedule will appear here.</div>')+'</div>')}
function profile(){const total=Object.values(state.activity).reduce((n,a)=>n+a.seconds,0), days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});return '<div class="eyebrow">Your intellectual journey</div><h1>Learning progress.</h1>'+section('Your progress','<div class="statgrid"><div class="stat"><strong>'+completed().length+'</strong><small>Titles completed</small></div><div class="stat"><strong>'+Math.floor(total/60)+'</strong><small>Minutes learned</small></div><div class="stat"><strong>'+(state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—')+'</strong><small>Quiz accuracy</small></div></div><div class="panel" style="margin-top:12px"><h3>Past seven days</h3><div class="days">'+days.map(d=>'<div>'+E(d.toLocaleDateString(undefined,{weekday:'short'}))+'<b>'+Math.floor((state.activity[day(d)]?.seconds||0)/60)+'m</b></div>').join('')+'</div><p class="muted">Subjects explored: '+new Set(completed().map(c=>c.category)).size+' · Review concepts: '+Object.keys(state.review).length+'</p></div>')+section('Preferences','<div class="panel"><div class="row between"><div><h3>Learning interests & daily goal</h3><small>'+state.goal+' minutes · '+state.interests.length+' interests</small></div><button class="secondary" data-action="prefs">Edit</button></div><div class="row between"><div><h3>Appearance</h3><small>'+E(state.theme)+'</small></div><button class="secondary" data-action="theme">Switch theme</button></div><div class="row between"><div><h3>Export personal data</h3><small>Save a copy of local progress and bookmarks.</small></div><button class="secondary" data-action="export">Export</button></div><div class="row between"><div><h3>Content studio</h3><small>Create original private lessons on this device.</small></div><button class="secondary" data-action="studio">Open</button></div><div class="row between"><div><h3>Delete local data</h3><small>Clear progress, preferences and custom content.</small></div><button class="secondary" data-action="reset">Delete</button></div></div>')+'<p class="note section">Lumen is an independent educational web app. No account, advertising, tracking, or cross-device sync. Your learning data is stored in this browser. Lessons are introductions, not professional advice.</p>'}
function render(){setTheme();document.getElementById('nav').innerHTML=['Today','Explore','Library','Review','Profile'].map(p=>'<button data-go="'+p+'" aria-label="'+p+'" class="'+(p===page?'active':'')+'" '+(p===page?'aria-current="page"':'')+'>'+icon(p)+'<span>'+p+'</span></button>').join('');main.innerHTML=header()+({Today:today,Explore:explore,Library:library,Review:review,Profile:profile}[page])()}
function openCourse(id){const c=get(id);if(!c)return;lastFocus=document.activeElement;session={id,step:progress(id).done?0:progress(id).step,mode:'course'};answered=null;started=Date.now();lesson.hidden=false;document.querySelector('.shell').inert=true;document.body.style.overflow='hidden';renderLesson();lesson.querySelector('button')?.focus()}
function openReview(){const d=due();if(!d.length)return;lastFocus=document.activeElement;session={mode:'review',queue:d.map(x=>x[0]),step:0};answered=null;started=Date.now();lesson.hidden=false;document.body.style.overflow='hidden';renderLesson();lesson.querySelector('button')?.focus()}
function schedule(id,i,correct){const k=id+':'+i,old=state.review[k]||{level:0};let level=correct?Math.min(old.level+1,6):0;const intervals=[.125,1,3,7,14,30,60];state.review[k]={level,next:Date.now()+intervals[level]*86400000};persist()}
function closeLesson(){if(session){log((Date.now()-started)/1000);session=null}lesson.hidden=true;lesson.innerHTML='';document.querySelector('.shell').inert=false;document.body.style.overflow='';render();if(lastFocus?.isConnected)lastFocus.focus();else main.querySelector('button')?.focus()}
function questionUI(q){return '<div class="eyebrow">Check your understanding</div><h1>'+E(q.q)+'</h1><div class="list">'+q.options.map((o,i)=>'<button class="option '+(answered!==null&&i===q.correct?'correct':answered===i&&i!==q.correct?'wrong':'')+'" data-answer="'+i+'" '+(answered!==null?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b> '+E(o)+'</button>').join('')+'</div>'+(answered!==null?'<div class="feedback" role="status"><h3>'+(answered===q.correct?'Exactly right.':'Here’s why.')+'</h3><p>'+E(q.why)+'</p></div>':'')}

function simulation(art){if(art==='compound')return '<div class="panel"><label for="rate">Annual growth rate: <b id="rateLabel">7%</b></label><input id="rate" type="range" min="0" max="15" value="7"><div id="compoundChart" class="chart" role="img" aria-label="Modeled investment values"></div><h3 id="balance"></h3><small>Starting value $1,000 · annual compounding · 20 years</small></div>';if(art==='supply')return '<div class="panel"><label for="demand">Demand intercept: <b id="demandLabel">90</b></label><input id="demand" type="range" min="60" max="120" value="90"><svg id="market" viewBox="0 0 340 210" role="img" aria-label="Supply and demand graph"></svg><h3 id="equilibrium"></h3><small>Model: Qd = intercept − 2P; Qs = 10 + 2P. Illustrative only.</small></div>';if(art==='coin')return '<div class="panel"><h3>Fair coin experiment</h3><div class="row"><button class="secondary" data-toss="10">Toss 10</button><button class="secondary" data-toss="100">Toss 100</button><button class="link" data-toss="reset">Reset</button></div><div class="bar"><span id="coinbar" style="width:50%"></span></div><h3 id="coinresult">No tosses yet.</h3><small>Uses simulated random independent tosses.</small></div>';return ''}
function renderLesson(){if(!session)return;let c,body='',total,step=session.step,q,bookmark='';if(session.mode==='review'){const k=session.queue[step];if(!k){closeLesson();notify('Review complete.');return}const [id,i]=k.split(':');c=get(id);q=c.questions[+i];total=session.queue.length;body=questionUI(q)}else{c=get(session.id);total=c.slides.length+c.questions.length;if(step<c.slides.length){const s=c.slides[step];const key=c.id+':s'+step;bookmark='<button class="iconbtn" data-save="'+E(key)+'" aria-label="'+(state.saved[key]?'Remove bookmark':'Save insight')+'" aria-pressed="'+!!state.saved[key]+'">'+icon('bookmark')+(state.saved[key]?'✓':'')+'</button>';body='<div class="eyebrow">'+E(c.category)+' · '+E(c.format)+'</div><h1>'+E(s.title)+'</h1>'+(step===0?editorial(c,'lessonart',step):artwork(s.art,'lessonart'))+'<p>'+E(s.text)+'</p>'+simulation(s.art)+sourceUI(c)}else{q=c.questions[step-c.slides.length];body=questionUI(q)}}
lesson.innerHTML='<div class="lessonhead"><div class="row between"><button class="iconbtn" data-action="close" aria-label="Exit lesson">'+icon('close')+'</button><small>'+E(c.title)+' · '+(step+1)+'/'+total+'</small>'+bookmark+'</div><div class="bar"><span style="width:'+((step+1)/total*100)+'%"></span></div></div><div class="lessonbody">'+body+'</div><div class="lessonfoot"><button class="secondary" data-action="prev" '+(session.mode==='review'||step===0||q?'disabled':'')+'>← Back</button><button class="primary" data-action="next" '+(q&&answered===null?'disabled':'')+'>'+(step===total-1?'Finish':'Continue')+' →</button></div>';if(document.getElementById('rate'))drawCompound(7);if(document.getElementById('demand'))drawSupply(90);if(document.getElementById('coinresult'))drawCoin();lesson.scrollTop=0}
function answer(i){if(!session||answered!==null)return;let c,j;if(session.mode==='review'){const [id,index]=session.queue[session.step].split(':');c=get(id);j=+index}else{c=get(session.id);j=session.step-c.slides.length}let q=c.questions[j];if(!q||i<0||i>=q.options.length)return;answered=i;state.attempts++;state.correct+=Number(i===q.correct);schedule(c.id,j,i===q.correct);persist();renderLesson()}
function next(){if(!session)return;if(session.mode==='review'){if(answered===null)return;session.step++;answered=null;renderLesson();return}const c=get(session.id),total=c.slides.length+c.questions.length;if(session.step>=c.slides.length&&answered===null)return;session.step++;answered=null;if(session.step>=total){state.progress[c.id]={step:0,done:true};log((Date.now()-started)/1000,1);session=null;closeLesson();notify('Lesson complete — new knowledge unlocked!');return}state.progress[c.id]={step:session.step,done:progress(c.id).done};persist();renderLesson()}
function prev(){if(session?.mode==='course'&&session.step>0&&session.step<get(session.id).slides.length){session.step--;answered=null;state.progress[session.id]={step:session.step,done:progress(session.id).done};persist();renderLesson()}}
function drawCompound(rate){rate=+rate;const values=[0,5,10,15,20].map(y=>1000*Math.pow(1+rate/100,y)),max=values[4];document.getElementById('rateLabel').textContent=rate+'%';document.getElementById('compoundChart').innerHTML=values.map((v,i)=>'<div><b>$'+Math.round(v).toLocaleString()+'</b><i style="height:'+Math.max(3,v/max*75)+'%"></i><small>Y'+i*5+'</small></div>').join('');document.getElementById('balance').textContent='After 20 years: $'+Math.round(max).toLocaleString()}
function drawSupply(intercept){intercept=+intercept;const P=(intercept-10)/4,Q=10+2*P,X=q=>35+q*2.15,Y=p=>185-p*2.6;document.getElementById('demandLabel').textContent=intercept;document.getElementById('market').innerHTML='<path d="M35 15v170h280" stroke="currentColor" fill="none"/><path d="M'+X(10)+' '+Y(0)+' L'+X(130)+' '+Y(60)+'" stroke="#6b9b77" stroke-width="3"/><path d="M'+X(intercept)+' '+Y(0)+' L'+X(0)+' '+Y(intercept/2)+'" stroke="#bd8756" stroke-width="3"/><path d="M35 '+Y(P)+' H'+X(Q)+' V185" fill="none" stroke="currentColor" stroke-dasharray="4 4"/><circle cx="'+X(Q)+'" cy="'+Y(P)+'" r="6" fill="currentColor"/><g fill="currentColor" font-size="11"><text x="4" y="15">Price</text><text x="253" y="203">Quantity</text><text x="225" y="28">Supply</text><text x="48" y="44">Demand</text></g>';document.getElementById('equilibrium').textContent='Equilibrium: price $'+P.toFixed(2)+' · quantity '+Q.toFixed(1)}
let tosses=0,heads=0;function drawCoin(){document.getElementById('coinbar').style.width=(tosses?heads/tosses*100:50)+'%';document.getElementById('coinresult').textContent=tosses?heads+' heads / '+tosses+' tosses · '+(heads/tosses*100).toFixed(1)+'% heads':'No tosses yet.'}
function prefs(){dialog.innerHTML='<form id="prefsForm"><div class="eyebrow">Make it yours</div><h2>What are you curious about?</h2><p class="muted">Choose any interests. You can explore every subject regardless.</p><div class="checkgrid">'+categories().map(c=>'<label><input type="checkbox" name="interest" value="'+E(c)+'" '+(state.interests.includes(c)?'checked':'')+'>'+E(c)+'</label>').join('')+'</div><label>Daily learning goal<select name="goal">'+[5,10,15,20].map(x=>'<option value="'+x+'" '+(state.goal===x?'selected':'')+'>'+x+' minutes</option>').join('')+'</select></label><button class="primary" type="submit">Save preferences</button><button class="link" type="button" data-action="dismiss">Not now</button></form>';dialog.showModal()}
function studio(){const example={title:'Why leaves change color',category:'Nature',desc:'Discover autumn pigments.',art:'nature',format:'Quick read',source:'https://www.fs.usda.gov/',slides:[{title:'Chlorophyll',text:'Leaves use chlorophyll to absorb light. As chlorophyll breaks down in autumn, other pigments can become visible.',art:'nature'}],questions:[{q:'Which pigment is associated with green leaves?',options:['Chlorophyll','Hemoglobin'],correct:0,why:'Chlorophyll absorbs light used in photosynthesis.'}]};dialog.innerHTML='<form id="studioForm"><h2>Content studio</h2><p class="muted">Add an original lesson with structured slides and questions. It is saved privately in this browser, not published to GitHub. Verify sources before sharing.</p><label>Lesson JSON<textarea name="json" rows="14" required>'+E(JSON.stringify(example,null,2))+'</textarea></label><small>Supported art: mind, scales, growth, orbit, nature, network, timeline, chance, chart, compound, supply, coin.</small><div class="row"><button class="primary" type="submit">Add lesson</button><button class="secondary" type="button" data-action="dismiss">Cancel</button></div></form>';dialog.showModal()}
function validCustom(x){const s=v=>typeof v==='string'&&v.trim().length>0&&v.length<4000;return x&&s(x.title)&&s(x.category)&&s(x.desc)&&Array.isArray(x.slides)&&x.slides.length>0&&x.slides.length<=30&&x.slides.every(y=>s(y.title)&&s(y.text)&&s(y.art))&&Array.isArray(x.questions)&&x.questions.length>0&&x.questions.length<=20&&x.questions.every(q=>s(q.q)&&s(q.why)&&Array.isArray(q.options)&&q.options.length>=2&&q.options.length<=6&&q.options.every(s)&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<q.options.length)}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='lumen-learning-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.go){if(d.go==='Explore'&&page!=='Explore'){filter='All';search='';format='All'}go(d.go);return}if(d.open){openCourse(d.open);return}if(d.topic){filter=d.topic;format='All';search='';go('Explore');return}if(d.filter){filter=d.filter;render();return}if(d.answer!==undefined){answer(+d.answer);return}if(d.save){const c=get(session.id),s=c.slides[session.step];if(state.saved[d.save]){delete state.saved[d.save];notify('Bookmark removed')}else{state.saved[d.save]={title:s.title,text:s.text};notify('Saved to your library')}persist();renderLesson();return}if(d.unsave){delete state.saved[d.unsave];delete state.notes[d.unsave];persist();render();return}if(d.note){dialog.innerHTML='<form id="noteForm" data-key="'+E(d.note)+'"><h2>Personal note</h2><label>What did you learn?<textarea name="note" rows="5">'+E(state.notes[d.note]||'')+'</textarea></label><button class="primary" type="submit">Save note</button><button class="link" type="button" data-action="dismiss">Cancel</button></form>';dialog.showModal();return}if(d.toss){if(d.toss==='reset'){tosses=0;heads=0}else{for(let i=0;i<+d.toss;i++){tosses++;heads+=Number(Math.random()<.5)}}drawCoin();return}switch(d.action){case 'theme':state.theme=state.theme==='dark'?'light':'dark';persist();render();break;case 'prefs':prefs();break;case 'dismiss':dialog.close();state.onboarded=true;persist();break;case 'close':closeLesson();break;case 'next':next();break;case 'prev':prev();break;case 'review':openReview();break;case 'export':exportData();break;case 'studio':studio();break;case 'reset':if(confirm('Permanently delete all Lumen data on this device?')){state=fresh();persist();go('Today');prefs()}break}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const q=search.toLowerCase().trim(),arr=all().filter(c=>(filter==='All'||c.category===filter)&&(format==='All'||c.format===format)&&(!q||(c.title+' '+c.desc+' '+c.category+' '+c.slides.map(s=>s.title+' '+s.text).join(' ')).toLowerCase().includes(q)));document.getElementById('results').innerHTML=cards(arr);const count=document.querySelector('#results').previousElementSibling.querySelector('small');if(count)count.textContent=arr.length+' titles'}if(e.target.id==='rate')drawCompound(e.target.value);if(e.target.id==='demand')drawSupply(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='format'){format=e.target.value;render()}});
document.addEventListener('submit',e=>{if(!['prefsForm','noteForm','studioForm'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target);if(e.target.id==='prefsForm'){state.interests=f.getAll('interest');state.goal=+f.get('goal');state.onboarded=true}else if(e.target.id==='noteForm'){state.notes[e.target.dataset.key]=String(f.get('note'))}else{try{const x=JSON.parse(f.get('json'));if(!validCustom(x))throw Error('Provide a title, category, description, slides and valid questions.');state.custom.push({id:'custom-'+Date.now(),title:x.title,category:x.category,desc:x.desc,art:x.art||'network',format:x.format==='Course'?'Course':'Quick read',difficulty:'Beginner',source:typeof x.source==='string'?x.source:'',slides:x.slides.map(s=>({title:s.title,text:s.text,art:s.art})),questions:x.questions.map(q=>({q:q.q,options:q.options,correct:q.correct,why:q.why}))});notify('Custom lesson added.')}catch(err){notify('Invalid lesson: '+err.message);return}}persist();dialog.close();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&session&&!dialog.open)closeLesson();if(e.key==='Tab'&&session&&!dialog.open){const focusable=[...lesson.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled)')];if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&(document.activeElement===first||!lesson.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!lesson.contains(document.activeElement))){e.preventDefault();first.focus()}}}});
window.addEventListener('pagehide',()=>{if(session){log((Date.now()-started)/1000);started=Date.now()}});
dialog.addEventListener('cancel',()=>{state.onboarded=true;persist()});
render();if(!state.onboarded)prefs();
</script></body></html>
