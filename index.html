.simlab select{width:100%;max-width:100%;font-size:13px;min-height:44px}

/* Lumen original interactive learning experiences */
.lx{padding:clamp(14px,3vw,24px);display:grid;gap:14px;min-width:0;overflow:hidden;border:1px solid var(--line)}

.lx-art{width:100%;height:auto;display:block;border-radius:12px;overflow:hidden}
.lx-steps{display:flex;gap:4px}.lx-steps i{height:4px;flex:1;background:var(--line);border-radius:4px}.lx-steps i.on{background:var(--accent)}
.lx-nav,.lx-tools{display:flex;align-items:stretch;flex-wrap:wrap;gap:8px}.lx-nav>*{flex:1}.lx-tools>*{flex:1 1 110px;min-width:0}
.lx-options{display:grid;gap:7px;min-width:0}.lx-parts{grid-template-columns:repeat(2,minmax(0,1fr))}
.lx button{min-height:44px;white-space:normal;font-size:13px;line-height:1.4;padding:10px 12px}

.lx-feedback{padding:11px 13px;border-radius:8px;background:var(--soft);border-left:3px solid var(--accent);font-size:14px;line-height:1.5}
.lx-feedback.good{border-left-color:#6d9c73}
.lx-range{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;font-size:13px;font-weight:650;align-items:center}

.lx-range output{font-variant-numeric:tabular-nums;font-size:13px}
.lx select,.lx input:not([type=range]){width:100%;min-height:44px;min-width:0}
.lx-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.lx-metrics>div{padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;min-width:0}
.lx-metrics small{display:block;font-size:11px;line-height:1.25}.lx-metrics strong{display:block;font-size:clamp(15px,3.4vw,23px);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:6px;overflow-wrap:anywhere}
.lx-timeline{display:flex;flex-wrap:wrap;gap:6px}.lx-timeline button{flex:1 1 auto}
.lx-order{display:grid;gap:5px;padding:10px;border:1px dashed var(--line);border-radius:9px}.lx-order div{font-size:13px}.lx-order b{display:inline-block;border-radius:5px;background:var(--soft);padding:2px 6px;margin-right:5px}
.lx-orderbook{display:grid;gap:9px;padding:12px;background:var(--soft);border-radius:10px}.lx-orderbook>div{display:flex;gap:7px;align-items:center;font-size:12px}.lx-orderbook span{height:12px;background:#92ad8c;border-radius:5px;max-width:55%}
#lx-shelf{grid-template-columns:repeat(8,minmax(0,1fr));flex-basis:100%}#lx-shelf button{padding:5px;font-size:12px;min-height:36px}
#lx-voters,#lx-kit{grid-template-columns:repeat(2,minmax(0,1fr));flex-basis:100%}
.lx-pop{animation:lx-reveal .38s ease both}@keyframes lx-reveal{from{opacity:0}to{opacity:1}}
@media(max-width:380px){.lx{padding:12px}.lx button{font-size:12px;padding:8px}.lx-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.lx-range{font-size:12px}}
@media(prefers-reduced-motion:reduce){.lx-pop{animation:none}}
